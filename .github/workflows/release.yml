name: Release

# Builds the apps and publishes a release named after the version in sender-pc/package.json.
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner android-sdk-platform-23 zipalign unzip
      - name: Build projector app
        run: receiver-android/build.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            dist/ProjectorCast.apk
            dist/ProjectorCast.version

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sender-pc/package-lock.json }
      - name: Build Windows installer
        working-directory: sender-pc
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/pc/ProjectorCast-Setup-*.exe
            dist/pc/ProjectorCast-Setup-*.exe.blockmap
            dist/pc/latest.yml

  mac:
    needs: apk
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sender-pc/package-lock.json }
      - name: Build macOS app (unsigned)
        working-directory: sender-pc
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/pc/*.dmg
            dist/pc/*-mac-*.zip
            dist/pc/latest-mac.yml

  linux:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sender-pc/package-lock.json }
      - name: Build Linux AppImage
        working-directory: sender-pc
        run: |
          npm ci
          npx electron-builder --linux AppImage --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/pc/*.AppImage
            dist/pc/latest-linux.yml

  release:
    needs: [apk, windows, mac, linux]
    # The Windows build is required; a failed macOS or Linux build doesn't block the release.
    if: ${{ !cancelled() && needs.apk.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "v=v$(node -p "require('./sender-pc/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Projector Cast ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.v }}
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            - `ProjectorCast-Setup-*.exe`: Windows installer
            - `ProjectorCast-*-mac-arm64.dmg` / `-mac-x64.dmg`: macOS (Apple silicon / Intel)
            - `ProjectorCast-*-linux-x86_64.AppImage`: Linux
            - `ProjectorCast.apk`: Android TV app (first install only; later updates come from the PC app)
          files: |
            out/ProjectorCast.apk
            out/ProjectorCast-Setup-*.exe
            out/ProjectorCast-Setup-*.exe.blockmap
            out/latest.yml
            out/*.dmg
            out/*-mac-*.zip
            out/latest-mac.yml
            out/*.AppImage
            out/latest-linux.yml
