name: Release

# Builds both apps and publishes them on the repository's Releases page, named after the
# version in sender-pc/package.json. Runs when the `release` branch is pushed (e.g.
# `git push origin main:release`), when a v* tag is pushed, or by hand from the Actions tab.
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner android-sdk-platform-23 zipalign unzip
      - name: Build projector app (APK)
        run: receiver-android/build.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            dist/ProjectorCast.apk
            dist/ProjectorCast.version

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sender-pc/package-lock.json
      - name: Build PC app (Windows installer, bundles the APK)
        working-directory: sender-pc
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/pc/ProjectorCast-Setup-*.exe
            dist/pc/ProjectorCast-Setup-*.exe.blockmap
            dist/pc/latest.yml

  release:
    needs: [apk, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "v=v$(node -p "require('./sender-pc/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Remove releases built before the signing key left the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in v1.3.0 v1.4.0 v1.5.0; do
            gh release delete "$t" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Projector Cast ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.v }}
          make_latest: true
          body: |
            **Downloads** (under Assets below)
            - **ProjectorCast-Setup-….exe**: install on your Windows PC.
            - **ProjectorCast.apk**: install on the projector by USB the first time; after that the PC app updates it.

            Installed PC apps (1.6 and later) update themselves from here.
          files: |
            out/ProjectorCast.apk
            out/ProjectorCast-Setup-*.exe
            out/ProjectorCast-Setup-*.exe.blockmap
            out/latest.yml
