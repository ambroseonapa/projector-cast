name: Release

# Builds both apps and publishes a release named after the version in sender-pc/package.json.
on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner android-sdk-platform-23 zipalign unzip
      - name: Build projector app (APK)
        run: receiver-android/build.sh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            dist/ProjectorCast.apk
            dist/ProjectorCast.version

  windows:
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sender-pc/package-lock.json
      - name: Build PC app (Windows installer, bundles the APK)
        working-directory: sender-pc
        run: |
          npm ci
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/pc/ProjectorCast-Setup-*.exe
            dist/pc/ProjectorCast-Setup-*.exe.blockmap
            dist/pc/latest.yml

  release:
    needs: [apk, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "v=v$(node -p "require('./sender-pc/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Projector Cast ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.v }}
          make_latest: true
          body: |
            - `ProjectorCast-Setup-*.exe`: Windows installer
            - `ProjectorCast.apk`: Android TV app (first install only; later updates come from the PC app)
          files: |
            out/ProjectorCast.apk
            out/ProjectorCast-Setup-*.exe
            out/ProjectorCast-Setup-*.exe.blockmap
            out/latest.yml
