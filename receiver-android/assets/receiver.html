<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: "Roboto", "Segoe UI", sans-serif; }
  #video { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: contain; background: #000;
    display: none; }
  /* Display mode 2: draw the video in its own GPU layer. */
  #video.gpu { -webkit-transform: translateZ(0); transform: translateZ(0); will-change: transform; }
  /* Display mode 3: the video only decodes (and plays sound); frames are painted onto the canvas. */
  #video.hidden-source { display: block !important; top: 0; left: 0; right: auto; bottom: auto; width: 2px; height: 2px; opacity: 0.01; }
  #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; }
  #idle { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #12324a, #05090e 70%); }
  .title { font-size: 3.2vw; letter-spacing: .08em; color: #8fc9ff; text-transform: uppercase; }
  .label { margin-top: 4vh; font-size: 2.4vw; color: #c8d6e3; }
  #code { font-size: 13vw; font-weight: 700; letter-spacing: .12em; margin: 1vh 0 2vh; font-variant-numeric: tabular-nums; }
  .hint { font-size: 1.9vw; color: #9fb2c4; max-width: 70vw; text-align: center; line-height: 1.5; }
  #ip { margin-top: 3vh; font-size: 1.6vw; color: #6f8396; }
  #version { position: fixed; right: 2vw; bottom: 2vh; font-size: 1.3vw; color: #4d6070; }
  #status { margin-top: 3vh; font-size: 2vw; color: #ffd27a; min-height: 2.5vw; }
  #stats { position: fixed; left: 2vw; bottom: 3vh; padding: 1.2vh 1.4vw; border-radius: 1vw;
    background: rgba(0,0,0,.72); font: 1.5vw/1.5 monospace; color: #d8f0ff; white-space: pre; display: none; }
  #badge { position: fixed; top: 2vh; right: 2vw; padding: .6vh 1.2vw; border-radius: 1vw;
    background: rgba(0,0,0,.6); font-size: 1.5vw; color: #cfe6ff; display: none; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="idle">
  <div class="title">Projector Cast</div>
  <div class="label">Code</div>
  <div id="code">------</div>
  <div class="hint">Enter this code in Projector Cast on your PC.</div>
  <div id="ip"></div>
  <div id="status"></div>
  <div id="version"></div>
</div>
<div id="badge"></div>
<div id="stats"></div>

<script>
var pc = null;
var video = document.getElementById('video');
var idle = document.getElementById('idle');
var badge = document.getElementById('badge');
var statusEl = document.getElementById('status');
var badgeTimer = null, dropTimer = null, statsTimer = null;
var statsOn = false, reconnects = 0, sizeChanges = 0, lastSize = '', prev = {};
var statsEl = document.getElementById('stats');
var canvas = document.getElementById('canvas');
var ctx2d = canvas.getContext('2d');
var displayMode = 1, painting = false;
var control = null;

// Picture settings from the projector menu, each -50..50. Sharpness is native-player only.
function setPicture(brightness, contrast, colour) {
  var f = 'brightness(' + (1 + brightness / 125) + ') contrast(' + (1 + contrast / 100) + ') saturate(' + (1 + colour / 50) + ')';
  if (!brightness && !contrast && !colour) f = '';
  video.style.filter = canvas.style.filter = f;
}

// Remote key for the PC; false if this connection has no control channel (older PC app).
function sendControl(key) {
  if (!control || control.readyState !== 'open') return false;
  control.send(JSON.stringify({ key: key }));
  return true;
}

function showInfo(code, ips, name, modeText, version) {
  document.getElementById('code').textContent = code;
  document.getElementById('ip').textContent = ips ? ('Projector address: ' + ips) : 'No network connection';
  if (version) document.getElementById('version').textContent = 'v' + version + '  \u00b7  display mode ' + modeText + '  (\u25c0 \u25b6 to change)  \u00b7  hold OK: menu';
}

// How this page draws the picture when the projector app uses a web display mode
// (1 = standard video, 2 = GPU layer, 3 = canvas). The app itself picks the mode.
function setWebMode(m) {
  displayMode = m >= 1 && m <= 3 ? m : 1;
  applyMode();
}

function applyMode() {
  var casting = !!pc && idle.style.display === 'none';
  video.className = displayMode === 2 ? 'gpu' : displayMode === 3 ? 'hidden-source' : '';
  video.style.display = casting && displayMode !== 3 ? 'block' : 'none';
  canvas.style.display = casting && displayMode === 3 ? 'block' : 'none';
  if (casting && displayMode === 3) startPainting(); else painting = false;
}

function startPainting() {
  if (painting) return;
  painting = true;
  var useFrameCallback = typeof video.requestVideoFrameCallback === 'function';
  function paint() {
    if (!painting) return;
    var vw = video.videoWidth, vh = video.videoHeight;
    var cw = window.innerWidth, ch = window.innerHeight;
    if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    if (vw && vh) {
      var scale = Math.min(cw / vw, ch / vh), w = vw * scale, h = vh * scale;
      ctx2d.drawImage(video, (cw - w) / 2, (ch - h) / 2, w, h);
    }
    if (useFrameCallback) video.requestVideoFrameCallback(paint); else requestAnimationFrame(paint);
  }
  if (useFrameCallback) video.requestVideoFrameCallback(paint); else requestAnimationFrame(paint);
}

function setStatus(t) { statusEl.textContent = t || ''; }

function showBadge(text, ms) {
  badge.textContent = text;
  badge.style.display = 'block';
  clearTimeout(badgeTimer);
  if (ms) badgeTimer = setTimeout(function () { badge.style.display = 'none'; }, ms);
}

function closePc() {
  clearInterval(statsTimer);
  painting = false;
  clearTimeout(dropTimer);
  if (pc) {
    pc.ontrack = pc.onaddstream = pc.oniceconnectionstatechange = pc.ondatachannel = null;
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  control = null;
}

function stopCast(reason) {
  closePc();
  video.pause();
  video.srcObject = null;
  idle.style.display = 'flex';
  applyMode();
  badge.style.display = 'none';
  statsEl.style.display = 'none';
  setStatus(reason || '');
}

function attachStream(stream) {
  if (video.srcObject !== stream) video.srcObject = stream;
  video.muted = false;
  var p = video.play();
  if (p && p.catch) p.catch(function () {
    // Autoplay with sound refused: play muted rather than show nothing.
    video.muted = true; video.play();
  });
  idle.style.display = 'none';
  applyMode();
}

function waitForIce(conn, ms) {
  return new Promise(function (resolve) {
    if (conn.iceGatheringState === 'complete') return resolve();
    var t = setTimeout(resolve, ms);
    conn.addEventListener('icegatheringstatechange', function () {
      if (conn.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
    });
  });
}

function toggleStats() {
  statsOn = !statsOn;
  statsEl.style.display = statsOn && pc ? 'block' : 'none';
}

function perSec(key, value, ts) {
  var p = prev[key];
  prev[key] = { v: value, t: ts };
  return p && ts > p.t ? (value - p.v) * 1000 / (ts - p.t) : null;
}

function fmt(v, digits) { return v == null || isNaN(v) ? '?' : v.toFixed(digits || 0); }

// What the projector itself sees: shows whether it is the Wi-Fi or the projector's chip that struggles.
function readStats(conn) {
  if (!conn.getStats) return;
  conn.getStats().then(function (rep) {
    var v = null, a = null, codecs = {};
    rep.forEach(function (r) {
      if (r.type === 'codec') codecs[r.id] = r;
      if (r.type === 'inbound-rtp' && (r.kind || r.mediaType) === 'video') v = r;
      if (r.type === 'inbound-rtp' && (r.kind || r.mediaType) === 'audio') a = r;
    });
    var lines = [];
    if (v) {
      var size = (v.frameWidth || video.videoWidth) + 'x' + (v.frameHeight || video.videoHeight);
      if (lastSize && size !== lastSize) sizeChanges++;
      lastSize = size;
      var fps = perSec('vframes', v.framesDecoded, v.timestamp);
      var vkbps = perSec('vbytes', v.bytesReceived * 8 / 1000, v.timestamp);
      var c = codecs[v.codecId];
      lines.push('Picture   ' + size + '  ' + fmt(fps) + ' fps  ' + fmt(vkbps == null ? null : vkbps / 1000, 1) + ' Mbps');
      lines.push('Decoder   ' + (c ? c.mimeType.replace('video/', '') : '?') + (v.decoderImplementation ? '  ' + v.decoderImplementation : '')
        + (v.powerEfficientDecoder === true ? '  (hardware)' : v.powerEfficientDecoder === false ? '  (SOFTWARE)' : ''));
      lines.push('Dropped   ' + (v.framesDropped != null ? v.framesDropped : '?') + ' frames   freezes ' + (v.freezeCount != null ? v.freezeCount : '?')
        + '   lost packets ' + (v.packetsLost != null ? v.packetsLost : '?'));
      lines.push('Size changes ' + sizeChanges + '   connection drops ' + reconnects);
    }
    if (a) {
      var akbps = perSec('abytes', a.bytesReceived * 8 / 1000, a.timestamp);
      var conceal = perSec('aconc', a.concealedSamples || 0, a.timestamp);
      var total = perSec('atotal', a.totalSamplesReceived || 0, a.timestamp);
      var ac = codecs[a.codecId];
      lines.push('Sound     ' + fmt(akbps) + ' kbps  ' + (ac && ac.channels === 2 ? 'stereo' : ac && ac.channels ? ac.channels + 'ch' : '?')
        + '   gaps ' + (total ? fmt(100 * conceal / total, 1) : '?') + '%   lost packets ' + (a.packetsLost != null ? a.packetsLost : '?'));
    }
    statsEl.textContent = lines.join('\n');
    statsEl.style.display = statsOn ? 'block' : 'none';
  }).catch(function () {});
}

// Ask for stereo, high-bitrate sound (by default the browser negotiates mono-quality voice).
function wantStereo(sdp) {
  var m = /a=rtpmap:(\d+) opus\/48000/i.exec(sdp);
  if (!m) return sdp;
  var re = new RegExp('a=fmtp:' + m[1] + ' ([^\\r\\n]*)');
  return sdp.replace(re, function (line, params) {
    var p = params.replace(/;?\s*(stereo|sprop-stereo|maxaveragebitrate)=\d+/g, '');
    return 'a=fmtp:' + m[1] + ' ' + p + ';stereo=1;sprop-stereo=1;maxaveragebitrate=256000';
  });
}

// Browsers may hide their address behind a random "xxxx.local" name the projector cannot look up.
// We already know the PC's real address from the HTTP connection, so put it back.
function unhideAddresses(sdp, ip) {
  if (!ip || !/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)) return sdp;
  return sdp.replace(/^(a=candidate:\S+ \d+ udp \d+ )[0-9a-f-]+\.local( )/gim, '$1' + ip + '$2');
}

function handleOffer(id, offerText, sender, senderIp) {
  var offer;
  try { offer = JSON.parse(offerText); } catch (e) { Cast.answer(id, '', 'bad offer'); return; }
  if (!offer || offer.type !== 'offer' || typeof offer.sdp !== 'string') { Cast.answer(id, '', 'bad offer'); return; }

  // Receive buffer chosen on the PC: 0 = lowest delay, more = smoother on weak Wi-Fi.
  var bufferMs = typeof offer.buffer === 'number' && offer.buffer >= 0 && offer.buffer <= 1000 ? offer.buffer : 150;
  offer = { type: 'offer', sdp: unhideAddresses(offer.sdp, senderIp) };
  closePc();
  prev = {}; lastSize = '';
  setStatus('Connecting to ' + sender + '\u2026');
  var conn = new RTCPeerConnection({ iceServers: [], bundlePolicy: 'max-bundle' });
  pc = conn;
  var stream = null;

  conn.ontrack = function (ev) {
    // Small extra buffer: rides out Wi-Fi hiccups instead of cutting the sound or freezing.
    var r = ev.receiver;
    if (r) {
      try { if ('jitterBufferTarget' in r) r.jitterBufferTarget = bufferMs; else r.playoutDelayHint = bufferMs / 1000; } catch (e) {}
    }
    stream = (ev.streams && ev.streams[0]) || stream || new MediaStream();
    if (stream.getTracks().indexOf(ev.track) < 0) stream.addTrack(ev.track);
    attachStream(stream);
  };
  conn.ondatachannel = function (ev) {
    if (ev.channel.label === 'control' && pc === conn) control = ev.channel;
  };
  if (!('ontrack' in conn)) conn.onaddstream = function (ev) { attachStream(ev.stream); };

  conn.oniceconnectionstatechange = function () {
    var st = conn.iceConnectionState;
    if (st === 'connected' || st === 'completed') {
      clearTimeout(dropTimer);
      showBadge(sender, 4000);
      clearInterval(statsTimer);
      statsTimer = setInterval(function () { readStats(conn); }, 1000);
    } else if (st === 'disconnected') {
      reconnects++;
      showBadge('Weak connection\u2026', 0);
      clearTimeout(dropTimer);
      dropTimer = setTimeout(function () { if (pc === conn) stopCast('Connection lost.'); }, 8000);
    } else if (st === 'failed' || st === 'closed') {
      if (pc === conn) stopCast('Connection lost.');
    }
  };

  conn.setRemoteDescription(offer)
    .then(function () { return conn.createAnswer(); })
    .then(function (ans) { return conn.setLocalDescription({ type: 'answer', sdp: wantStereo(ans.sdp) }); })
    .then(function () { return waitForIce(conn, 3000); })
    .then(function () {
      Cast.answer(id, JSON.stringify({ type: 'answer', sdp: conn.localDescription.sdp }), '');
    })
    .catch(function (e) {
      if (pc === conn) stopCast('Connection failed: ' + e);
      Cast.answer(id, '', String(e && e.message || e));
    });
}

if (!window.RTCPeerConnection) {
  setStatus('Android System WebView is out of date. Update it and reopen the app.');
}
</script>
</body>
</html>
